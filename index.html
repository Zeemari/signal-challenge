<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1c4539" />
    <meta name="description" content="SIGNAL — know what's known, see what's fresh. Transparent, time-sensitive community reporting." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap"
      rel="stylesheet"
    />
    <title>SIGNAL — Know what's known</title>
    <style>
      #preloader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #f6f5f1;
        transition: opacity 0.25s ease;
      }
      #preloader.preloader-hide {
        opacity: 0;
        pointer-events: none;
      }
      .preloader-badge {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 56px;
        height: 56px;
        border-radius: 16px;
        background-color: #255a4c;
        animation: preloader-pulse 1.1s ease-in-out infinite;
      }
      @keyframes preloader-pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(0.9); opacity: 0.7; }
      }
    </style>
  </head>
  <body>
    <div id="preloader">
      <span class="preloader-badge">
        <svg viewBox="0 0 24 24" fill="none" width="30" height="30">
          <path
            d="M3 13h3.2l1.8-7 3.6 11 2-6.5 1.4 2.5h3.8"
            stroke="#eef4f2"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </span>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
