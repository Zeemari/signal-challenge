<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/folder.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1c4539" />
    <meta name="description" content="SIGNAL — know what's known, see what's fresh. Transparent, time-sensitive community reporting." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap"
      rel="stylesheet"
    />
    <title>SIGNAL — Know what's known</title>
    <style>
      #preloader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #f6f5f1;
        transition: opacity 0.25s ease;
      }
      #preloader.preloader-hide {
        opacity: 0;
        pointer-events: none;
      }
      .preloader-badge {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 56px;
        height: 56px;
        border-radius: 16px;
        background-color: #ffffff;
        box-shadow: 0 1px 2px rgba(16, 40, 34, 0.08), 0 0 0 1px rgba(16, 40, 34, 0.05);
      }
      .preloader-badge img {
        width: 34px;
        height: 34px;
        object-fit: contain;
      }
      .preloader-dots {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        margin-top: 18px;
      }
      .preloader-dots span {
        width: 7px;
        height: 7px;
        border-radius: 9999px;
        background-color: #255a4c;
        animation: preloader-dot-bounce 1s ease-in-out infinite;
      }
      .preloader-dots span:nth-child(2) { animation-delay: 0.15s; }
      .preloader-dots span:nth-child(3) { animation-delay: 0.3s; }
      @keyframes preloader-dot-bounce {
        0%, 80%, 100% { transform: translateY(0); opacity: 0.5; }
        40% { transform: translateY(-6px); opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="preloader">
      <div>
        <span class="preloader-badge">
          <img src="/folder.png" alt="" />
        </span>
        <div class="preloader-dots">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
